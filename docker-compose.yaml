services:
  db:
    container_name: log_db
    image: timescale/timescaledb-ha:pg18
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    restart: always
    ports:
      - 5437:5432
  grafana:
    image: grafana/grafana:12.4.3-security-02-ubuntu
    container_name: log_grafana
    ports:
      - "4242:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - db
  vector:
    container_name: log_vector
    image: timberio/vector:0.53.0-debian
    command: ["--config", "/app/vector.toml"]
    volumes:
      - ./vector.toml:/app/vector.toml:ro
      - ./transforms.vrl:/app/transforms.vrl:ro
      # - ./logs:/var/logs:ro
    environment:
      VECTOR_DB_URL: "postgres://postgres@log_db:5432/postgres"
      VECTOR_PORT: "1234"
      VECTOR_USERNAME: "admin"
      VECTOR_PASSWORD: "admin"
    ports:
      - 1234:1234
    depends_on:
      - db
