services:
  db:
    container_name: log_db
    image: timescale/timescaledb-ha:pg18
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    restart: always
    ports:
      - 5437:5432
  grafana:
    image: grafana/grafana:12.4.3-security-02-ubuntu
    container_name: log_grafana
    ports:
      - "4242:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - LOG_DB_HOST=${LOG_DB_HOST:-log_db}
      - LOG_DB_PORT=${LOG_DB_PORT:-5432}
      - LOG_DB_USER=${LOG_DB_USER:-postgres}
      - LOG_DB_PASSWORD=${LOG_DB_PASSWORD:-password}
      - LOG_DB_NAME=${LOG_DB_NAME:-postgres}
      - LOG_DB_SSLMODE=${LOG_DB_SSLMODE:-disable}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:4242}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_KEYCLOAK_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_KEYCLOAK_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile roles offline_access
      - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=full_name
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${GRAFANA_KEYCLOAK_AUTH_URL}
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${GRAFANA_KEYCLOAK_TOKEN_URL}
      - GF_AUTH_GENERIC_OAUTH_API_URL=${GRAFANA_KEYCLOAK_API_URL}
      - GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN=true
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'grafanaadmin') && 'GrafanaAdmin' || contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=true
      - GF_PATHS_PROVISIONING=/app/grafana/provisioning
    volumes:
      - ./grafana/provisioning:/app/grafana/provisioning
    depends_on:
      - db
  vector:
    container_name: log_vector
    image: timberio/vector:0.53.0-debian
    command: ["--config", "/app/vector.toml"]
    volumes:
      - ./vector.toml:/app/vector.toml:ro
      - ./transforms.vrl:/app/transforms.vrl:ro
      - ./logs:/var/logs:ro
    environment:
      VECTOR_DB_URL: "postgres://postgres@log_db:5432/postgres"
      VECTOR_PORT: "1234"
      VECTOR_USERNAME: "admin"
      VECTOR_PASSWORD: "admin"
    ports:
      - 1234:1234
    depends_on:
      - db
