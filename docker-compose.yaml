services:
  db:
    container_name: log_db
    image: timescale/timescaledb-ha:pg18
    volumes:
      - ./scripts:/docker-entrypoint-initdb.d/
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    restart: always
    ports:
      - 5437:5432
  metabase:
    image: metabase/metabase:v0.53.3
    container_name: log_metabase
    ports:
      - '3617:3000'
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: postgres
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_HOST: log_db
      MB_PASSWORD_COMPLEXITY: weak
      MB_PASSWORD_LENGTH: 4
    depends_on:
      - db
  grafana:
    image: grafana/grafana:latest
    container_name: log_grafana
    ports:
      - "4242:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    # volumes:
      # - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - db
  vector:
    container_name: log_vector
    image: timberio/vector:0.53.0-debian
    command: ["--config","/app/vector.toml"]
    volumes:
      - ./vector.toml:/app/vector.toml:ro
      - ./transforms.vrl:/app/transforms.vrl:ro
      # - ./logs:/var/logs:ro
    environment:
      VECTOR_DB_URL: "postgres://postgres@log_db:5432/postgres"
      VECTOR_PORT: "1234"
      VECTOR_USERNAME: "admin"
      VECTOR_PASSWORD: "admin"
    ports:
      - 1234:1234
    depends_on:
      - db