data_dir = "/tmp"

[sources.http]
type = "http_server"
address= "0.0.0.0:${VECTOR_PORT}"
auth.strategy="basic"
auth.username="${VECTOR_USERNAME}"
auth.password="${VECTOR_PASSWORD}"

# useful for debugging locally
#[sources.file]
#type = "file"
#include = ["/var/logs/*"]

[transforms.parse_logs]
type= "remap"
file = "/app/transforms.vrl"
inputs = ["http"]
# useful for debugging locally
# inputs = ["http", "file"]


# useful for debugging locally
#[sinks.console]
#type = "console"
#encoding.codec = "json"
#inputs = ["parse_logs"]

[sinks.timescaledb]
type = "postgres"
inputs = ["parse_logs"]
endpoint = "${VECTOR_DB_URL}"
table = "logs"