data_dir = "/tmp"

[sources.syslog]
type = "syslog"
address = "0.0.0.0:${VECTOR_PORT}"
mode = "tcp"

# useful for debugging locally
#[sources.file]
#type = "file"
#include = ["/var/logs/*"]

[transforms.parse_logs]
type= "remap"
file = "/app/transforms.vrl"
inputs = ["syslog"]

# useful for debugging locally
[sinks.console]
type = "console"
encoding.codec = "json"
inputs = ["parse_logs"]

[sinks.timescaledb]
type = "postgres"
inputs = ["parse_logs"]
endpoint = "${VECTOR_DB_URL}"
table = "logs"